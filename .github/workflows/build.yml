name: Build HACK AI

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Android mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: nightly
          target: Android64

      - name: Upload mod
        uses: actions/upload-artifact@v4
        with:
          name: HACK-AI-Android
          path: ${{ steps.build.outputs.build-output }}
